<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RUN360X - Realidade Aumentada & Corrida Gamificada</title>

    <!-- Primary PWA & Theme Color -->
    <meta name="theme-color" content="#020617" />
    <meta name="background-color" content="#020617" />
    <meta name="description" content="Mapa Tático de Realidade Aumentada para corrida de rua gamificada com GPS em tempo real, Corredor Fantasma e desafios da comunidade." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple iOS Safari Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RUN360X" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon.svg" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('RUN360X PWA ServiceWorker registrado com sucesso:', reg.scope))
            .catch(err => console.warn('Erro ao registrar ServiceWorker:', err));
        });
      }
    </script>
  </body>
</html>
