<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Glowing Radar Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />

  <!-- Tactical Lightning / Runner Bolt Symbol -->
  <path d="M 280 80 L 160 270 L 250 270 L 220 430 L 360 230 L 270 230 Z" fill="url(#neonGrad)" filter="url(#glow)"/>

  <!-- Pulse Flame Core -->
  <circle cx="340" cy="150" r="18" fill="url(#fireGrad)" filter="url(#glow)"/>
  <circle cx="180" cy="380" r="12" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Brand Typography -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="4">RUN360X</text>
</svg>
